<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Night Lanterns</title>
<meta name="description" content="A calm, endless bedtime scene. Tap a dark lake to release glowing paper lanterns and watch them drift up into the stars. No score, no goals — just something quiet to hold for a few minutes before sleep.">

<meta name="theme-color" content="#05060d">
<meta name="color-scheme" content="dark">

<!-- home-screen install -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Lanterns">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">

<!-- link previews -->
<meta property="og:type" content="website">
<meta property="og:title" content="Night Lanterns">
<meta property="og:description" content="Tap a dark lake to release glowing paper lanterns and watch them drift up into the stars. A quiet thing to hold for a few minutes before sleep.">
<meta property="og:image" content="/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Paper lanterns glowing above a dark lake at night, their light reflected on still water beneath a field of stars.">
<meta property="og:site_name" content="Night Lanterns">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Night Lanterns">
<meta name="twitter:description" content="Tap a dark lake to release glowing paper lanterns and watch them drift up into the stars.">
<meta name="twitter:image" content="/og-image.jpg">

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #04050a;
    overflow: hidden;
    overscroll-behavior: none;          /* no pull-to-refresh */
    touch-action: none;                 /* no pan / pinch-zoom */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* faint first-run hint */
  #hint {
    position: fixed; left: 0; right: 0; bottom: 22vh;
    text-align: center;
    font: 300 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.26em; text-transform: lowercase;
    color: rgba(255, 226, 178, 0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 3.5s ease;
    text-shadow: 0 0 18px rgba(255, 176, 92, 0.25);
  }
  #hint.show { opacity: 0.65; }

  /* tiny mute toggle, deliberately easy to ignore */
  #sound {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 44px; height: 44px;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 2.5s ease;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  #sound.show { opacity: 0.22; pointer-events: auto; }
  #sound:active { opacity: 0.5; }
  #sound svg { width: 20px; height: 20px; stroke: #ffd9a8; fill: none;
               stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  #sound .off { display: none; }
  #sound.muted .on { display: none; }
  #sound.muted .off { display: block; }

  /* sleep fade veil */
  #veil { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }

  /* shown only if WebGL is unavailable */
  #nogl {
    position: fixed; inset: 0; display: none; place-items: center;
    padding: 2rem; text-align: center;
    font: 300 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(255, 226, 178, 0.55);
  }
</style>
</head>
<body>

<div id="hint">tap the water</div>

<div id="sound" role="button" tabindex="0" aria-label="Toggle ambient sound">
  <svg viewBox="0 0 24 24" class="on"  aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
  <svg viewBox="0 0 24 24" class="off" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>
</div>

<div id="veil"></div>
<div id="nogl"><p>This scene needs WebGL, which this browser doesn&rsquo;t seem to have available.</p></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
