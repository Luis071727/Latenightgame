<!DOCTYPE html>
<html lang="en">

<title>Wanderer of Soft Worlds</title>
<meta name="description" content="A calm, endless bedtime wander. Walk a hooded figure through a small multiverse of soft-coloured worlds grown from fractals, waking them gently as you go. No score, no timers, no way to fail — just somewhere quiet to be for a few minutes before sleep.">

<meta name="color-scheme" content="dark">

<style>
  /* The title face. One weight, latin subset only, bundled so the scene keeps
     working offline. Everything else stays on the system sans — the UI is a
     handful of lowercase words and a good system font renders them better
     than a second download would. */
  @font-face {
    font-family: 'Cormorant Garamond';
    font-style: normal;
    font-weight: 300;
    font-display: swap;
    src: url('/fonts/cormorant-garamond-300.woff2') format('woff2');
  }

  :root {
    /* the UI's whole palette, so every element drinks from the same cup */
    --ink:        rgba(240, 228, 255, 0.82);
    --ink-soft:   rgba(240, 228, 255, 0.55);
    --ink-faint:  rgba(240, 228, 255, 0.38);
    --line:       rgba(226, 214, 255, 0.28);
    --line-firm:  rgba(226, 214, 255, 0.50);
    --wash:       rgba(24, 20, 40, 0.66);
    --glow:       rgba(200, 178, 255, 0.28);
    --accent:     rgba(255, 214, 168, 0.85);
    --serif: 'Cormorant Garamond', ui-serif, Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #2b2740;
    overflow: hidden;
    overscroll-behavior: none;          /* no pull-to-refresh */
    touch-action: none;                 /* no pan / pinch-zoom */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* faint first-run hint */
  #hint {
    position: fixed; left: 0; right: 0; bottom: 22vh;
    text-align: center;
    font: 300 15px/1.6 var(--sans);
    letter-spacing: 0.26em; text-transform: lowercase;
    color: var(--ink-soft);
    opacity: 0; pointer-events: none;
    transition: opacity 3.5s ease;
    text-shadow: 0 0 18px var(--glow);
  }
  #hint.show { opacity: 0.65; }

  /* second hint, offered once the first tap has landed */
  #hint2 {
    position: fixed; left: 0; right: 0; bottom: 15vh;
    text-align: center;
    font: 300 13px/1.6 var(--sans);
    letter-spacing: 0.24em; text-transform: lowercase;
    color: rgba(240, 228, 255, 0.46);
    opacity: 0; pointer-events: none;
    transition: opacity 3.5s ease;
    text-shadow: 0 0 18px rgba(200, 178, 255, 0.22);
  }
  #hint2.show { opacity: 0.5; }

  /* the name of the world you have just arrived in */
  #worldname {
    position: fixed; left: 0; right: 0;
    top: max(9vh, calc(env(safe-area-inset-top) + 24px));
    text-align: center;
    font: 300 clamp(17px, 2.4vw, 21px)/1.4 var(--serif);
    font-style: italic;
    letter-spacing: 0.30em; text-transform: lowercase;
    color: var(--ink-soft);
    opacity: 0; pointer-events: none;
    transition: opacity 2.8s ease;
    text-shadow: 0 0 22px var(--glow);
  }
  #worldname.show { opacity: 0.78; }

  /* offered when standing before an open gate, so travel never depends on
     hitting an exact radius while moving */
  #step {
    position: fixed; left: 50%;
    bottom: max(12vh, calc(env(safe-area-inset-bottom) + 76px));
    translate: -50% 0;
    padding: 14px 32px; min-height: 48px; box-sizing: border-box;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(226, 214, 255, 0.07);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font: 300 13px/1.4 var(--sans);
    letter-spacing: 0.28em; text-transform: lowercase; text-indent: 0.28em;
    color: var(--ink);
    text-shadow: 0 0 14px var(--glow);
    opacity: 0; pointer-events: none;
    transition: opacity 1.4s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #step.show { opacity: 0.85; pointer-events: auto; }
  #step:active { opacity: 1; }

  /* a memory arriving. It does not pause anything, ask for anything, or wait
     to be dismissed — it says what was found and then it goes away. */
  #memory {
    position: fixed; left: 0; right: 0;
    top: max(16vh, calc(env(safe-area-inset-top) + 84px));
    text-align: center; padding: 0 28px;
    opacity: 0; pointer-events: none;
    transition: opacity 1.6s ease;
  }
  #memory.show { opacity: 1; }
  #memory .kind {
    font: 300 10px/1.6 var(--sans);
    letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  #memory .name {
    margin-top: 5px;
    font: 300 clamp(20px, 3.4vw, 26px)/1.35 var(--serif);
    letter-spacing: 0.10em;
    color: var(--ink);
    text-shadow: 0 0 26px var(--glow);
  }
  #memory .note {
    margin-top: 7px;
    font: 300 12.5px/1.65 var(--sans);
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    max-width: 30ch; margin-left: auto; margin-right: auto;
    font-style: italic;
  }
  /* rarer finds are warmer, and that is the whole of the fanfare */
  #memory.rare .name  { color: #ffe0b4; text-shadow: 0 0 30px rgba(255,200,140,0.45); }
  #memory.dream .name { color: #ffd9a0; text-shadow: 0 0 34px rgba(255,190,120,0.55); }
  #memory.mythic .name{ color: #ffcf90; text-shadow: 0 0 40px rgba(255,180,110,0.65); }

  /* corner controls: mute on the right, settings on the left. Deliberately
     easy to ignore — the world is the interface, these are the margins. */
  #sound, #gear {
    position: fixed;
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 44px; height: 44px;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 2.5s ease;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  #sound { right: max(14px, env(safe-area-inset-right)); }
  #gear  { left:  max(14px, env(safe-area-inset-left)); }
  #sound.show, #gear.show { opacity: 0.22; pointer-events: auto; }
  #sound:active, #gear:active { opacity: 0.5; }
  #sound svg, #gear svg { width: 20px; height: 20px; stroke: #e6dcff; fill: none;
               stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  #sound .off { display: none; }
  #sound.muted .on { display: none; }
  #sound.muted .off { display: block; }

  /* floating joystick — it appears under the finger and fades out on release */
  #stick {
    position: fixed; top: 0; left: 0;
    width: 0; height: 0;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
    will-change: transform;
  }
  #stick.show { opacity: 0.30; }
  #stick::before {
    content: ""; position: absolute;
    left: -46px; top: -46px; width: 92px; height: 92px;
    border-radius: 50%;
    border: 1px solid rgba(226, 214, 255, 0.55);
  }
  #knob {
    position: absolute;
    left: -17px; top: -17px; width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(226, 214, 255, 0.30);
    box-shadow: 0 0 18px rgba(198, 178, 255, 0.35);
    will-change: transform;
  }

  /* where a tap landed: one soft breath of light, then gone */
  #tapmark {
    position: fixed; top: 0; left: 0;
    width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(240, 224, 255, 0.30) 0%,
      rgba(214, 196, 255, 0.12) 45%,
      rgba(214, 196, 255, 0) 70%);
    opacity: 0; pointer-events: none;
    will-change: transform, opacity;
  }
  #tapmark.ripple { animation: tapfade 0.9s ease-out; }
  @keyframes tapfade {
    0%   { opacity: 0.75; scale: 0.45; }
    100% { opacity: 0;    scale: 1.25; }
  }

  /* ── the title, floating over the live world ─────────────────────────── */
  #title {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background:
      radial-gradient(ellipse at 50% 42%,
        rgba(18, 14, 32, 0.10) 0%,
        rgba(18, 14, 32, 0.42) 62%,
        rgba(14, 10, 26, 0.72) 100%);
    opacity: 1;
    transition: opacity 2.2s ease;
  }
  #title.gone { opacity: 0; pointer-events: none; }
  #title-inner { text-align: center; padding: 0 24px; }
  #title h1 {
    margin: 0 0 6px;
    font: 300 clamp(34px, 8vw, 58px)/1.22 var(--serif);
    letter-spacing: 0.14em; text-transform: lowercase;
    color: var(--ink);
    text-shadow: 0 0 34px rgba(200, 178, 255, 0.40);
    /* the title drifts up into place as the page settles */
    animation: titlerise 2.8s ease both;
  }
  #title p {
    margin: 0 0 7vh;
    font: 300 12px/1.7 var(--sans);
    letter-spacing: 0.34em; text-transform: lowercase;
    color: var(--ink-faint);
    animation: titlerise 2.8s 0.5s ease both;
  }
  @keyframes titlerise {
    from { opacity: 0; translate: 0 14px; }
    to   { opacity: 1; translate: 0 0; }
  }
  #begin {
    appearance: none; -webkit-appearance: none;
    background: rgba(226, 214, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 15px 38px;
    min-height: 48px;
    font: 300 14px/1 var(--sans);
    letter-spacing: 0.30em; text-transform: lowercase;
    text-indent: 0.30em;               /* recentre the letterspaced label */
    color: var(--ink);
    cursor: pointer;
    transition: background 0.4s ease, border-color 0.4s ease, scale 0.25s ease;
    animation: titlerise 2.8s 1.0s ease both;
    text-shadow: 0 0 14px var(--glow);
  }
  #begin:hover { background: rgba(226, 214, 255, 0.11); border-color: var(--line-firm); }
  #begin:active { scale: 0.97; }

  /* ── settings ────────────────────────────────────────────────────────── */
  #panel {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: end center;
    background: rgba(10, 8, 20, 0.35);
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #panel.open { opacity: 1; pointer-events: auto; }
  #panel-card {
    width: min(400px, calc(100vw - 28px));
    margin-bottom: max(16px, env(safe-area-inset-bottom));
    box-sizing: border-box;
    padding: 22px 24px calc(14px + env(safe-area-inset-bottom) * 0.4);
    border-radius: 22px;
    background: var(--wash);
    border: 1px solid rgba(226, 214, 255, 0.14);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 12px 48px rgba(6, 4, 14, 0.5);
    translate: 0 14px; scale: 0.985;
    transition: translate 0.35s ease, scale 0.35s ease;
  }
  #panel.open #panel-card { translate: 0 0; scale: 1; }
  #panel-card h2 {
    margin: 0 0 16px;
    font: 300 15px/1.3 var(--serif);
    font-style: italic;
    letter-spacing: 0.30em; text-transform: lowercase;
    color: var(--ink-soft);
    text-align: center;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    min-height: 44px;
  }
  .row label {
    font: 300 13px/1.4 var(--sans);
    letter-spacing: 0.18em; text-transform: lowercase;
    color: var(--ink-soft);
    flex: none;
  }
  /* a row whose control needs the whole width — the quality picker at its
     widest is five words, which will not sit beside a label on a phone */
  .row.stack {
    display: block;
    padding: 6px 0 2px;
  }
  .row.stack label { display: block; margin-bottom: 8px; }

  /* toggles: a quiet pill, no browser chrome */
  .toggle {
    appearance: none; -webkit-appearance: none;
    width: 46px; height: 26px; flex: none;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(226, 214, 255, 0.07);
    position: relative; cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(240, 228, 255, 0.55);
    transition: translate 0.3s ease, background 0.3s ease;
  }
  .toggle[aria-pressed="true"] {
    background: rgba(255, 214, 168, 0.16);
    border-color: rgba(255, 214, 168, 0.45);
  }
  .toggle[aria-pressed="true"]::after {
    translate: 20px 0;
    background: var(--accent);
  }

  /* sliders: a thin line of light */
  input[type="range"] {
    appearance: none; -webkit-appearance: none;
    flex: 1; max-width: 190px; height: 26px;
    background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px; border-radius: 1px;
    background: rgba(226, 214, 255, 0.24);
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none;
    width: 16px; height: 16px; margin-top: -7px;
    border-radius: 50%; border: none;
    background: rgba(240, 228, 255, 0.75);
    box-shadow: 0 0 12px var(--glow);
  }
  input[type="range"]::-moz-range-track {
    height: 2px; border-radius: 1px;
    background: rgba(226, 214, 255, 0.24);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%; border: none;
    background: rgba(240, 228, 255, 0.75);
    box-shadow: 0 0 12px var(--glow);
  }

  /* segmented pickers — a few small words, one of them lit */
  .seg { display: flex; gap: 4px; justify-content: space-between; }
  .seg button {
    appearance: none; -webkit-appearance: none;
    flex: 1;
    background: none; border: 1px solid transparent;
    border-radius: 999px;
    padding: 9px 6px;
    font: 300 11px/1 var(--sans);
    letter-spacing: 0.14em; text-transform: lowercase;
    color: var(--ink-faint);
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .seg button.on {
    color: var(--accent);
    border-color: rgba(255, 214, 168, 0.35);
  }

  /* resetting the journey: quiet, and it asks twice */
  #set-archive,
  #set-reset {
    appearance: none; -webkit-appearance: none;
    display: block; width: 100%;
    margin-top: 14px;
    background: none;
    border: 1px solid rgba(226, 214, 255, 0.16);
    border-radius: 999px;
    padding: 12px 16px;
    font: 300 12px/1 var(--sans);
    letter-spacing: 0.22em; text-transform: lowercase;
    text-indent: 0.22em;
    color: var(--ink-faint);
    cursor: pointer;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  #set-archive:hover,
  #set-reset:hover { color: var(--ink-soft); border-color: var(--line); }
  #set-reset.confirm { color: var(--accent); border-color: rgba(255, 214, 168, 0.45); }
  #set-archive { color: var(--ink-soft); border-color: rgba(226, 214, 255, 0.24); margin-top: 18px; }

  /* under a reduced-motion preference the chrome stops moving too */
  @media (prefers-reduced-motion: reduce) {
    #title h1, #title p, #begin { animation-duration: 0.01s; animation-delay: 0s; }
    #tapmark.ripple { animation-duration: 0.4s; }
  }

  /* ── the Dream Archive ───────────────────────────────────────────────
     A page rather than a dashboard. The world stays faintly visible behind
     it, and everything is the same translucent, letterspaced, unhurried
     material as the rest of the interface. */
  #journal {
    position: fixed; inset: 0; z-index: 35;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(10, 8, 20, 0.52);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #journal.open { opacity: 1; pointer-events: auto; }

  #journal .j-card {
    width: min(560px, 100vw);
    height: min(88vh, 900px);
    display: flex; flex-direction: column;
    box-sizing: border-box;
    border-radius: 26px 26px 0 0;
    background: rgba(22, 18, 38, 0.82);
    border: 1px solid rgba(226, 214, 255, 0.13);
    border-bottom: none;
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 -12px 60px rgba(6, 4, 14, 0.55);
    translate: 0 20px;
    transition: translate 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
  }
  #journal.open .j-card { translate: 0 0; }

  #journal .j-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 22px 0;
  }
  #journal .j-title {
    font: 300 15px/1.3 var(--serif); font-style: italic;
    letter-spacing: 0.30em; text-transform: lowercase;
    color: var(--ink-soft);
  }
  #journal .j-close {
    appearance: none; -webkit-appearance: none;
    background: none; border: none; cursor: pointer;
    width: 40px; height: 40px; margin: -8px -10px -8px 0;
    display: grid; place-items: center;
    color: var(--ink-faint); font-size: 22px; line-height: 1;
    transition: color 0.25s ease;
  }
  #journal .j-close:hover { color: var(--ink); }

  #journal .j-tabs {
    display: flex; gap: 3px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid rgba(226, 214, 255, 0.09);
  }
  #journal .j-tabs button {
    appearance: none; -webkit-appearance: none;
    flex: 1; min-height: 40px;
    background: none; border: 1px solid transparent; border-radius: 999px;
    font: 300 11px/1 var(--sans);
    letter-spacing: 0.16em; text-transform: lowercase;
    color: var(--ink-faint); cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  #journal .j-tabs button.on {
    color: var(--accent); border-color: rgba(255, 214, 168, 0.32);
  }

  #journal .j-body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 22px calc(28px + env(safe-area-inset-bottom));
  }
  .j-page { display: flex; flex-direction: column; gap: 22px; padding-top: 20px; }

  .j-hero { text-align: center; }
  .j-hero-title {
    font: 300 clamp(23px, 5vw, 30px)/1.3 var(--serif);
    letter-spacing: 0.10em; color: var(--ink);
    text-shadow: 0 0 28px var(--glow);
  }
  .j-hero-sub {
    margin-top: 6px;
    font: 300 12.5px/1.6 var(--sans); font-style: italic;
    letter-spacing: 0.06em; color: var(--ink-soft);
  }

  .j-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .j-stat {
    padding: 15px 14px; border-radius: 16px;
    background: rgba(226, 214, 255, 0.045);
    border: 1px solid rgba(226, 214, 255, 0.07);
    text-align: center;
  }
  .j-stat-v { font: 300 25px/1.1 var(--serif); color: var(--ink); }
  .j-stat-l {
    margin-top: 5px; font: 300 10px/1.4 var(--sans);
    letter-spacing: 0.22em; text-transform: lowercase; color: var(--ink-faint);
  }
  .j-stat-s { margin-top: 2px; font: 300 10px/1.4 var(--sans); color: rgba(240,228,255,0.28); }

  .j-block { display: flex; flex-direction: column; gap: 9px; }
  .j-label {
    font: 300 10px/1.4 var(--sans);
    letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-faint);
  }
  .j-note { font: 300 12px/1.6 var(--sans); color: var(--ink-soft); font-style: italic; }
  .j-quiet {
    font: 300 11.5px/1.75 var(--sans); font-style: italic;
    color: rgba(240, 228, 255, 0.30); text-align: center;
    padding: 6px 10px 10px; max-width: 34ch; margin: 0 auto;
  }

  /* a proportion as a line of light, never a game progress bar */
  .j-meter {
    height: 2px; border-radius: 2px;
    background: rgba(226, 214, 255, 0.13); overflow: hidden;
  }
  .j-meter-fill {
    height: 100%;
    background: linear-gradient(90deg, rgba(255,214,168,0.45), rgba(255,214,168,0.92));
    box-shadow: 0 0 10px rgba(255, 200, 150, 0.5);
    transition: width 0.7s ease;
  }

  .j-world {
    display: flex; flex-direction: column; gap: 10px;
    padding: 17px 16px; border-radius: 18px;
    background: rgba(226, 214, 255, 0.04);
    border: 1px solid rgba(226, 214, 255, 0.07);
    border-left: 2px solid var(--w-accent, rgba(226,214,255,0.3));
  }
  .j-world-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .j-world-name {
    font: 300 16px/1.3 var(--serif); font-style: italic;
    letter-spacing: 0.08em; color: var(--ink);
  }
  .j-world-pct { font: 300 12px/1 var(--sans); letter-spacing: 0.12em; color: var(--accent); }
  .j-rows { display: flex; flex-direction: column; gap: 5px; margin-top: 2px; }
  .j-row { display: flex; justify-content: space-between; gap: 12px; }
  .j-row-l {
    font: 300 11.5px/1.5 var(--sans);
    letter-spacing: 0.16em; text-transform: lowercase; color: var(--ink-faint);
  }
  .j-row-v { font: 300 11.5px/1.5 var(--sans); color: var(--ink-soft); }

  .j-set {
    font: 300 11px/1.5 var(--sans);
    letter-spacing: 0.18em; text-transform: lowercase;
    color: var(--ink-faint); padding: 2px 0 6px;
  }
  .j-set.done { color: var(--accent); }

  .j-mem { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; }
  .j-mem + .j-mem { border-top: 1px solid rgba(226, 214, 255, 0.05); }
  .j-mem-dot {
    width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none;
    background: rgba(226, 214, 255, 0.16);
  }
  .j-mem.found .j-mem-dot {
    background: var(--accent);
    box-shadow: 0 0 calc(6px * var(--r-glow, 1)) rgba(255, 205, 150, 0.75);
  }
  .j-mem-text { flex: 1; min-width: 0; }
  .j-mem-name { font: 300 14px/1.4 var(--serif); letter-spacing: 0.05em; color: var(--ink); }
  .j-mem.unfound .j-mem-name { color: rgba(240, 228, 255, 0.22); letter-spacing: 0.3em; }
  .j-mem-note { margin-top: 2px; font: 300 11.5px/1.55 var(--sans); font-style: italic; color: var(--ink-soft); }
  .j-mem.unfound .j-mem-note { color: rgba(240, 228, 255, 0.22); }
  .j-mem-rar {
    font: 300 9.5px/1.4 var(--sans); letter-spacing: 0.16em;
    text-transform: lowercase; color: var(--ink-faint); flex: none; padding-top: 4px;
  }
  .j-mem.r-rare .j-mem-rar   { color: rgba(255, 214, 168, 0.65); }
  .j-mem.r-dream .j-mem-rar  { color: rgba(255, 200, 150, 0.8); }
  .j-mem.r-mythic .j-mem-rar { color: rgba(255, 190, 130, 0.95); }

  /* comparison rows: no rank number, no position, nothing lost */
  .j-beside {
    display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
    padding: 9px 12px; border-radius: 11px;
  }
  .j-beside.me { background: rgba(255, 214, 168, 0.08); }
  .j-beside-n {
    font: 300 12px/1.5 var(--sans); font-style: italic;
    color: var(--ink-soft); min-width: 0;
  }
  .j-beside.me .j-beside-n { color: var(--accent); font-style: normal; letter-spacing: 0.14em; }
  .j-beside-v { font: 300 13px/1.4 var(--serif); color: var(--ink); flex: none; }

  .j-picker { display: flex; flex-direction: column; gap: 7px; }
  .j-pick {
    appearance: none; -webkit-appearance: none;
    text-align: left; width: 100%; min-height: 48px;
    padding: 11px 15px; border-radius: 14px;
    background: rgba(226, 214, 255, 0.04);
    border: 1px solid rgba(226, 214, 255, 0.08);
    cursor: pointer; transition: border-color 0.25s ease, background 0.25s ease;
  }
  .j-pick:hover:not(:disabled) { background: rgba(226, 214, 255, 0.075); }
  .j-pick.on { border-color: rgba(255, 214, 168, 0.42); background: rgba(255, 214, 168, 0.07); }
  .j-pick.locked { opacity: 0.34; cursor: default; }
  .j-pick-name {
    font: 300 13.5px/1.4 var(--serif); letter-spacing: 0.06em; color: var(--ink);
  }
  .j-pick.on .j-pick-name { color: var(--accent); }
  .j-pick-note { margin-top: 2px; font: 300 11px/1.5 var(--sans); font-style: italic; color: var(--ink-soft); }

  /* the soft light a dream-gate fades through */
  #flash { position: fixed; inset: 0; z-index: 40; background: #cfc4e8; opacity: 0; pointer-events: none; }

  /* sleep fade veil */
  #veil { position: fixed; inset: 0; z-index: 45; background: #000; opacity: 0; pointer-events: none; }

  /* shown only if WebGL is unavailable */
  #nogl {
    position: fixed; inset: 0; z-index: 60; display: none; place-items: center;
    padding: 2rem; text-align: center;
    font: 300 15px/1.7 var(--sans);
    color: rgba(240, 228, 255, 0.6);
  }
</style>
</head>
<body>

<div id="hint">drag anywhere to wander</div>
<div id="hint2">walk near things to wake them</div>
<div id="worldname"></div>

<div id="memory" aria-live="polite">
  <div class="kind"></div>
  <div class="name"></div>
  <div class="note"></div>
</div>

<div id="stick"><div id="knob"></div></div>
<div id="tapmark"></div>
<div id="step" role="button" tabindex="0">step through</div>

<div id="sound" role="button" tabindex="0" aria-label="Toggle ambient sound">
  <svg viewBox="0 0 24 24" class="on"  aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
  <svg viewBox="0 0 24 24" class="off" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>
</div>

<div id="gear" role="button" tabindex="0" aria-label="Settings">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4L6 18M18 18l-1.6-1.6M7.6 7.6L6 6"/>
  </svg>
</div>

<div id="panel" aria-hidden="true">
  <div id="panel-card" role="dialog" aria-label="Settings">
    <h2>settings</h2>
    <div class="row">
      <label for="set-sound">sound</label>
      <button id="set-sound" class="toggle" aria-pressed="true" aria-label="Sound on or off"></button>
    </div>
    <div class="row">
      <label for="set-music">music</label>
      <input id="set-music" type="range" min="0" max="1" step="0.05" value="1" aria-label="Music volume">
    </div>
    <div class="row">
      <label for="set-amb">ambience</label>
      <input id="set-amb" type="range" min="0" max="1" step="0.05" value="1" aria-label="Ambience volume">
    </div>
    <div class="row">
      <label for="set-motion">reduced motion</label>
      <button id="set-motion" class="toggle" aria-pressed="false" aria-label="Reduced motion"></button>
    </div>
    <div class="row stack">
      <label>pace</label>
      <div id="set-pace" class="seg" role="radiogroup" aria-label="Walking pace">
        <button data-p="stroll">stroll</button>
        <button data-p="wander" class="on">wander</button>
        <button data-p="drift">drift</button>
      </div>
    </div>
    <div class="row stack">
      <label>quality</label>
      <div id="set-quality" class="seg" role="radiogroup" aria-label="Graphics quality">
        <button data-q="auto" class="on">auto</button>
        <button data-q="saver">saver</button>
        <button data-q="low">low</button>
        <button data-q="medium">med</button>
        <button data-q="high">high</button>
      </div>
    </div>
    <button id="set-archive">open the dream archive</button>
    <button id="set-reset">begin the journey again</button>
  </div>
</div>

<div id="journal" aria-hidden="true">
  <div class="j-card" role="dialog" aria-label="Dream Archive">
    <div class="j-head">
      <div class="j-title">dream archive</div>
      <button class="j-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="j-tabs" role="tablist"></div>
    <div class="j-body"></div>
  </div>
</div>

<div id="title" aria-label="Wanderer of Soft Worlds">
  <div id="title-inner">
    <h1>wanderer<br>of soft worlds</h1>
    <p>a bedtime wander</p>
    <button id="begin">begin wandering</button>
  </div>
</div>

<div id="flash"></div>
<div id="veil"></div>
<div id="nogl"><p>This scene needs WebGL, which this browser doesn&rsquo;t seem to have available.</p></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
