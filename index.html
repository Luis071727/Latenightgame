<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>Night Lanterns</title>
<style>
  :root { --ui: rgba(255, 226, 178, 0.5); }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #04050a;
    overflow: hidden;
    overscroll-behavior: none;          /* no pull-to-refresh */
    touch-action: none;                 /* no pan / pinch-zoom */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* faint first-run hint */
  #hint {
    position: fixed; left: 0; right: 0; bottom: 22vh;
    text-align: center;
    font: 300 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.26em; text-transform: lowercase;
    color: var(--ui);
    opacity: 0; pointer-events: none;
    transition: opacity 3.5s ease;
    text-shadow: 0 0 18px rgba(255, 176, 92, 0.25);
  }
  #hint.show { opacity: 0.65; }

  /* tiny mute toggle, deliberately easy to ignore */
  #sound {
    position: fixed; right: max(14px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 44px; height: 44px;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 2.5s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #sound.show { opacity: 0.22; pointer-events: auto; }
  #sound:active { opacity: 0.5; }
  #sound svg { width: 20px; height: 20px; stroke: #ffd9a8; fill: none;
               stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  #sound .off { display: none; }
  #sound.muted .on { display: none; }
  #sound.muted .off { display: block; }

  /* sleep fade + wake-from-black veil */
  #veil {
    position: fixed; inset: 0; background: #000;
    opacity: 0; pointer-events: none;
  }
</style>
</head>
<body>

<div id="hint">tap the water</div>

<div id="sound" aria-label="sound">
  <svg viewBox="0 0 24 24" class="on"  aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
  <svg viewBox="0 0 24 24" class="off" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>
</div>

<div id="veil"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════════════
   CONFIG — tweak everything here
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {

  // ── palette (hex) ────────────────────────────────────────────────────
  // Two sky moods; the scene drifts back and forth between them slowly.
  skyTopA:     0x121a3a,   // deep indigo overhead
  skyTopB:     0x1a1636,   // slightly violet alternate
  skyHorizon:  0x05060d,   // near-black at the horizon
  waterDeep:   0x0a1020,   // water close to camera
  waterFar:    0x070a14,   // water at the horizon (a hair above the sky)
  lanternWarm: 0xffb257,   // core amber
  lanternCool: 0xff8f4d,   // the other end of the lantern tint range
  fireflyHue:  0xffd08a,
  mistColor:   0x2a3352,

  // ── overall brightness (bedtime = low) ───────────────────────────────
  exposure:      0.92,     // renderer tone-mapping exposure
  glowStrength:  0.55,     // lantern halo opacity
  starBrightness: 0.62,

  // ── lanterns ─────────────────────────────────────────────────────────
  maxLanterns:   34,       // hard cap; oldest is retired when exceeded
  riseSpeed:     0.55,     // units/sec for a normal lantern
  riseSpeedBig:  0.34,     // units/sec for a hold-released lantern
  swayAmount:    0.16,     // sideways wander while rising
  nearestSpawn:  8,        // lanterns never appear closer than this
  farthestSpawn: 80,       // ...or further away than this
  fadeStartY:    30,       // altitude where a lantern starts dissolving
  fadeEndY:      66,       // ...and where it is recycled
  holdForBig:    650,      // ms of holding before a lantern counts as "big"
  holdMax:      1800,      // ms at which lantern size maxes out

  // ── stars ────────────────────────────────────────────────────────────
  starCount:     1400,     // per shell; two shells are created
  starDrift:     0.0055,   // radians/sec of sky rotation
  twinkleSpeed:  0.35,

  // ── atmosphere ───────────────────────────────────────────────────────
  fireflyCount:  10,
  mistPuffs:     7,
  windStrength:  0.10,     // ambient breeze
  breezePower:   1.1,      // drag acceleration, world units/sec²
  breezeRadius:  9.0,      // world units of drag influence
  breezeDecay:   1.8,      // seconds for a breeze puff to die out
  maxDrift:      0.55,     // ceiling on sideways lantern speed, units/sec

  // ── camera ───────────────────────────────────────────────────────────
  camHeight:     4.5,      // eye height above the water (a low bank/dock)
  bobAmount:     0.055,    // vertical breathing (0 = perfectly still)
  bobSpeed:      0.16,

  // ── time ─────────────────────────────────────────────────────────────
  moodPeriod:    420,      // seconds for a full colour / density cycle
  sleepAfter:    600,      // seconds of no touch before the scene dims
  sleepFade:     50,       // seconds the dim-to-black takes
  wakeFade:      2.5,      // seconds to come back after a tap

  // ── performance ──────────────────────────────────────────────────────
  maxPixelRatio: 2,        // cap DPR (mobile GPUs hate 3x)
  autoDegrade:   true,     // step quality down if the frame rate sags

  // ── audio ────────────────────────────────────────────────────────────
  volume:        0.16,     // master; intentionally very quiet
  audioOn:       true,
};

/* ═══════════════════════════════════════════════════════════════════════
   setup
   ═══════════════════════════════════════════════════════════════════════ */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const motion = reduceMotion ? 0.25 : 1;          // global movement multiplier

const renderer = new THREE.WebGLRenderer({
  antialias: false,            // cheap: we lean on soft sprites instead
  alpha: false,
  powerPreference: 'high-performance',
});
renderer.setClearColor(CONFIG.skyHorizon, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CONFIG.exposure;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(CONFIG.skyHorizon, 0.009);

const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 900);
camera.position.set(0, CONFIG.camHeight, 6);

const clock = new THREE.Clock();
let time = 0;

/* ─── canvas-generated textures (keeps the file self-contained/offline) ── */

// Soft radial glow. `power` shapes the falloff — higher = tighter core.
// alpha = (1-r)^power, so it always reaches exactly zero at the rim and
// never leaves a visible circular edge.
function glowTexture(size = 128, power = 3.0) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    grd.addColorStop(t, `rgba(255,255,255,${Math.pow(1 - t, power).toFixed(4)})`);
  }
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// A vertical smear for the reflection on the water: bright at the top
// (nearest the lantern), feathered to nothing on every other edge.
function streakTexture(w = 64, h = 256) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    const v = y / (h - 1);                       // 0 at the lantern end
    // fade out toward the viewer, and ease in at the very top so the quad's
    // own edge never shows as a hard line on the water
    const along = Math.pow(1 - v, 2.0) * Math.min(1, v / 0.14);
    for (let x = 0; x < w; x++) {
      const u = (x / (w - 1)) * 2 - 1;           // -1..1 across the width
      // soft bell across the width, widening as the streak recedes
      const spread = 1 / (0.60 + v * 0.90);
      const across = Math.exp(-(u * u) * 3.0 * spread);
      const i = (y * w + x) * 4;
      d[i] = d[i + 1] = d[i + 2] = 255;
      d[i + 3] = Math.round(255 * along * across);
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  // the quad is viewed almost edge-on, so anisotropic filtering matters here
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const TEX = {
  glow:   glowTexture(128, 4.0),   // tight bright core
  halo:   glowTexture(128, 1.9),   // broad soft halo
  mist:   glowTexture(128, 2.2),
  streak: streakTexture(),
};

/* ═══════════════════════════════════════════════════════════════════════
   sky dome — vertical gradient, indigo overhead into black at the horizon
   ═══════════════════════════════════════════════════════════════════════ */
const skyUniforms = {
  uTop:     { value: new THREE.Color(CONFIG.skyTopA) },
  uHorizon: { value: new THREE.Color(CONFIG.skyHorizon) },
};

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 24, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: skyUniforms,
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uTop; uniform vec3 uHorizon;
      varying vec3 vPos;
      void main() {
        float h = clamp(normalize(vPos).y * 1.35 + 0.06, 0.0, 1.0);
        h = pow(h, 0.75);
        vec3 col = mix(uHorizon, uTop, h);
        // a hint of warmth low in the sky, like distant town light
        col += vec3(0.035, 0.020, 0.008) * pow(1.0 - h, 7.0);
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
sky.renderOrder = -10;
scene.add(sky);

/* ═══════════════════════════════════════════════════════════════════════
   starfield — two shells rotating at different rates for slow parallax
   ═══════════════════════════════════════════════════════════════════════ */
const starUniforms = {
  uTime:    { value: 0 },
  uOpacity: { value: CONFIG.starBrightness },
  uDensity: { value: 0.8 },       // drifts over minutes: fades stars in and out
  uScale:   { value: 1 },
};

function makeStarShell(count, radius, sizeScale) {
  const pos   = new Float32Array(count * 3);
  const attrs = new Float32Array(count * 3); // size, phase, densityThreshold

  for (let i = 0; i < count; i++) {
    // bias toward the upper hemisphere — few stars below the horizon line
    const u = Math.random() * 2 - 1;
    const y = Math.abs(u) * 0.94 + 0.02;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = Math.random() * Math.PI * 2;
    pos[i * 3    ] = Math.cos(th) * r * radius;
    pos[i * 3 + 1] = y * radius;
    pos[i * 3 + 2] = Math.sin(th) * r * radius;

    const bright = Math.pow(Math.random(), 2.6);          // mostly faint
    attrs[i * 3    ] = (0.7 + bright * 3.4) * sizeScale;
    attrs[i * 3 + 1] = Math.random() * Math.PI * 2;
    attrs[i * 3 + 2] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aStar', new THREE.BufferAttribute(attrs, 3));

  const mat = new THREE.ShaderMaterial({
    uniforms: starUniforms,
    transparent: true, depthWrite: false, fog: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute vec3 aStar;          // x=size  y=phase  z=densityThreshold
      uniform float uTime, uScale, uDensity;
      varying float vAlpha;
      varying float vWarm;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        // slow twinkle
        float tw = 0.72 + 0.28 * sin(uTime * ${CONFIG.twinkleSpeed.toFixed(3)} + aStar.y * 6.2);
        // stars fade in / out as the "density" uniform drifts
        float d = smoothstep(aStar.z - 0.16, aStar.z + 0.16, uDensity);
        vAlpha = tw * d;
        vWarm  = fract(aStar.y * 3.71);
        float px = aStar.x * uScale * (300.0 / max(1.0, -mv.z)) * 1.5;
        // dim rather than shrink below a pixel, otherwise tiny stars shimmer
        vAlpha *= clamp(px, 0.0, 1.4) / 1.4;
        gl_PointSize = clamp(px, 1.0, 16.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uOpacity;
      varying float vAlpha; varying float vWarm;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.06, d);
        a *= a;
        // a few stars lean warm, most stay pale blue-white but dim
        vec3 col = mix(vec3(0.72, 0.78, 0.95), vec3(1.0, 0.86, 0.68), vWarm * 0.75);
        gl_FragColor = vec4(col, a * vAlpha * uOpacity);
      }`,
  });

  return new THREE.Points(geo, mat);
}

const starsNear = makeStarShell(CONFIG.starCount, 260, 1.25);
const starsFar  = makeStarShell(CONFIG.starCount, 520, 1.0);
scene.add(starsNear, starsFar);

/* ═══════════════════════════════════════════════════════════════════════
   water — flat plane, all the life comes from the fragment shader
   ═══════════════════════════════════════════════════════════════════════ */
const waterUniforms = {
  uTime:  { value: 0 },
  uDeep:  { value: new THREE.Color(CONFIG.waterDeep) },
  uFar:   { value: new THREE.Color(CONFIG.waterFar) },
  uCam:   { value: new THREE.Vector3() },
  uSpark: { value: 1.0 },
};

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(1400, 1400),
  new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    fog: false,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform float uTime, uSpark;
      uniform vec3 uDeep, uFar, uCam;
      varying vec3 vWorld;

      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

      void main() {
        float dist = length(vWorld.xz - uCam.xz);

        // gentle gradient: the lake keeps its blue nearby and melts into the
        // horizon slowly, so there is a readable waterline
        float f = 1.0 - exp(-dist * 0.012);
        vec3 col = mix(uDeep, uFar, clamp(f, 0.0, 1.0));

        float near = 1.0 - f;
        float fine = exp(-dist * 0.09);     // fine detail only close to the eye

        // three layers of lazy swell — brightness only, no displacement
        float w1 = sin(vWorld.z * 0.55 + uTime * 0.30)
                 * sin(vWorld.x * 0.37 - uTime * 0.20);
        float w2 = sin(vWorld.z * 1.30 - uTime * 0.46 + vWorld.x * 0.28);
        float w3 = sin(vWorld.z * 3.10 + uTime * 0.70 + vWorld.x * 1.40);
        col += vec3(0.030, 0.038, 0.058) * (w1 * 0.55 * near + (w2 * 0.30 + w3 * 0.15) * fine);

        // sparse round glints: starlight catching the surface
        vec2 gp   = vWorld.xz * 0.45;
        vec2 cell = floor(gp);
        float h   = hash(cell);
        vec2 seed = vec2(hash(cell + 3.1), hash(cell + 7.7));
        float dd  = length(fract(gp) - seed);
        float dot_  = smoothstep(0.10, 0.0, dd);
        float blink = smoothstep(0.90, 1.0, sin(uTime * (0.35 + h * 0.5) + h * 40.0));
        col += vec3(0.24, 0.27, 0.38) * dot_ * blink * step(0.58, h) * fine * uSpark;

        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
water.rotation.x = -Math.PI / 2;
water.position.y = 0;
water.renderOrder = -5;
scene.add(water);

/* ═══════════════════════════════════════════════════════════════════════
   drifting mist — a handful of huge, almost invisible sprites
   ═══════════════════════════════════════════════════════════════════════ */
const mists = [];
for (let i = 0; i < CONFIG.mistPuffs; i++) {
  const m = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX.mist,
    color: CONFIG.mistColor,
    transparent: true, depthWrite: false, fog: false,
    blending: THREE.AdditiveBlending,
    opacity: 0.035 + Math.random() * 0.03,
  }));
  const s = 40 + Math.random() * 70;
  m.scale.set(s, s * 0.34, 1);
  m.position.set(
    (Math.random() - 0.5) * 190,
    0.4 + Math.random() * 3.5,
    -8 - Math.random() * 150
  );
  m.userData.speed = (Math.random() - 0.5) * 0.22;
  scene.add(m);
  mists.push(m);
}

/* ═══════════════════════════════════════════════════════════════════════
   lanterns
   Each lantern = low-poly paper body + two additive glow sprites, plus a
   stretched sprite lying on the water that fakes the reflection.
   ═══════════════════════════════════════════════════════════════════════ */
const lanternGeo = new THREE.CylinderGeometry(0.30, 0.22, 0.54, 8, 1, true);
// bake a vertical gradient into the paper: bright near the flame, dim at the base
{
  const p = lanternGeo.attributes.position;
  const col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const t = THREE.MathUtils.clamp((p.getY(i) + 0.27) / 0.54, 0, 1);
    const k = 0.30 + 0.70 * Math.pow(t, 0.7);
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = k;
  }
  lanternGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}

// unit quad whose local +Y runs along the reflection's length
const reflGeo = new THREE.PlaneGeometry(1, 1);

const lanterns = [];
const lanternPool = [];

function buildLantern() {
  const group = new THREE.Group();

  // paper shell — unlit on purpose, it *is* the light source
  const bodyMat = new THREE.MeshBasicMaterial({
    color: CONFIG.lanternWarm,
    vertexColors: true,
    transparent: true, opacity: 0.95,
    side: THREE.DoubleSide,
    depthWrite: false,
    fog: true,
  });
  const body = new THREE.Mesh(lanternGeo, bodyMat);
  group.add(body);

  // core + halo
  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX.glow, color: 0xffd9a0, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: true,
  }));
  core.scale.set(1.5, 1.5, 1);
  group.add(core);

  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX.halo, color: CONFIG.lanternWarm, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: true,
  }));
  halo.scale.set(2.9, 2.9, 1);
  group.add(halo);

  // reflection: a flat quad lying *on* the water, pointing at the camera.
  // Laid flat rather than billboarded so the water can't occlude it and so
  // the grazing viewing angle foreshortens it the way a real reflection is.
  const refl = new THREE.Mesh(reflGeo, new THREE.MeshBasicMaterial({
    map: TEX.streak, color: CONFIG.lanternWarm, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: true,
  }));
  refl.rotation.order = 'YXZ';
  refl.rotation.x = -Math.PI / 2;
  refl.renderOrder = -1;       // after the water, before the lanterns
  scene.add(refl);

  return { group, body, core, halo, refl };
}

function spawnLantern(x, z, bigness = 0) {
  // bigness 0..1 — how long the finger was held down
  if (lanterns.length >= CONFIG.maxLanterns) retire(lanterns[0]);
  let L = lanternPool.pop();
  if (!L) { L = buildLantern(); scene.add(L.group); }

  const size  = 0.75 + bigness * 1.25;
  const tint  = new THREE.Color(CONFIG.lanternWarm)
                  .lerp(new THREE.Color(CONFIG.lanternCool), Math.random() * 0.55);

  L.group.visible = true;
  L.refl.visible  = true;
  L.group.position.set(x, 0.34, z);
  L.group.scale.setScalar(size * 0.35);          // grows in as it lifts off
  L.group.rotation.y = Math.random() * Math.PI;

  L.size    = size;
  L.rise    = THREE.MathUtils.lerp(CONFIG.riseSpeed, CONFIG.riseSpeedBig, bigness)
              * (0.85 + Math.random() * 0.3);
  L.vx = 0; L.vz = 0;
  L.phase   = Math.random() * Math.PI * 2;
  L.spin    = (Math.random() - 0.5) * 0.16;
  L.life    = 0;
  L.alpha   = 0;
  L.glow    = (0.75 + bigness * 0.5);

  L.body.material.color.copy(tint);
  L.core.material.color.set(0xffe0b0);
  L.halo.material.color.copy(tint);
  L.refl.material.color.copy(tint);

  lanterns.push(L);
  return L;
}

function retire(L) {
  const i = lanterns.indexOf(L);
  if (i >= 0) lanterns.splice(i, 1);
  L.group.visible = false;
  L.refl.visible = false;
  lanternPool.push(L);
}

function updateLanterns(dt) {
  const wind = windVector(time);

  for (let i = lanterns.length - 1; i >= 0; i--) {
    const L = lanterns[i];
    L.life += dt;

    // ease in: opacity and scale settle over the first couple of seconds
    L.alpha = Math.min(1, L.alpha + dt * 0.7);
    const grow = THREE.MathUtils.damp(L.group.scale.x, L.size, 1.4, dt);
    L.group.scale.setScalar(grow);

    // rise, with a slow ramp so it lifts off the water gently
    const lift = L.rise * Math.min(1, L.life * 0.55) * motionSlow;
    L.group.position.y += lift * dt;

    // breeze + ambient wind, always damped back toward stillness
    L.vx += wind.x * dt * 0.55;
    L.vz += wind.y * dt * 0.55;
    for (const b of breezes) {
      const dx = L.group.position.x - b.x;
      const dz = L.group.position.z - b.z;
      const d2 = dx * dx + dz * dz;
      if (d2 < b.r * b.r) {
        const falloff = (1 - Math.sqrt(d2) / b.r) * b.life * b.strength;
        L.vx += b.dx * falloff * CONFIG.breezePower * dt;
        L.vz += b.dz * falloff * CONFIG.breezePower * dt;
      }
    }
    L.vx *= Math.pow(0.55, dt);          // everything decays back to calm
    L.vz *= Math.pow(0.55, dt);

    // hard ceiling on drift speed — a frantic swipe must never fling anything
    const sp = Math.hypot(L.vx, L.vz);
    if (sp > CONFIG.maxDrift) {
      const k = CONFIG.maxDrift / sp;
      L.vx *= k; L.vz *= k;
    }

    L.group.position.x += L.vx * dt;
    L.group.position.z += L.vz * dt;

    // gentle sway + a little drift toward the horizon as it climbs
    L.phase += dt * 0.4;
    L.group.position.x += Math.sin(L.phase) * CONFIG.swayAmount * dt * motionSlow;
    L.group.position.z -= dt * 0.16 * motionSlow;
    L.group.rotation.y += L.spin * dt;
    L.group.rotation.z = Math.sin(L.phase * 0.7) * 0.05;

    // dissolve high in the sky, then recycle
    const y = L.group.position.y;
    let vis = L.alpha;
    if (y > CONFIG.fadeStartY) {
      vis *= 1 - THREE.MathUtils.clamp(
        (y - CONFIG.fadeStartY) / (CONFIG.fadeEndY - CONFIG.fadeStartY), 0, 1);
    }
    if (vis <= 0.004 || y > CONFIG.fadeEndY || L.group.position.z < -260) {
      retire(L);
      continue;
    }

    const flicker = 0.9 + 0.1 * Math.sin(L.life * 2.3 + L.phase);
    const g = vis * CONFIG.glowStrength * L.glow * flicker * sceneDim;

    L.body.material.opacity = vis * 0.9 * sceneDim;
    L.core.material.opacity = Math.min(1, g * 1.5);
    L.halo.material.opacity = g * 0.5;
    L.core.scale.setScalar(1.15 * L.size * (0.97 + 0.03 * flicker));
    L.halo.scale.setScalar(2.9 * L.size);

    // ── reflection ────────────────────────────────────────────────────
    // A lantern sitting on the water throws a long shimmering column; as it
    // climbs, the mirrored image slides toward the viewer and fades away.
    const hFade = THREE.MathUtils.clamp(1 - y / 14, 0, 1);
    if (hFade > 0.004) {
      const wob = Math.sin(time * 0.9 + L.phase) * 0.12;
      const lx = L.group.position.x + wob;
      const lz = L.group.position.z;

      // where the ray from the eye to the mirrored lantern crosses the water
      const cy = camera.position.y;
      const t  = cy / (cy + y);
      const px = camera.position.x + (lx - camera.position.x) * t;
      const pz = camera.position.z + (lz - camera.position.z) * t;

      let ux = camera.position.x - px, uz = camera.position.z - pz;
      const ul = Math.hypot(ux, uz) || 1;
      ux /= ul; uz /= ul;

      const len = (2.0 + y * 0.45) * L.size;
      const wid = 0.95 * L.size * (1 + 0.16 * Math.sin(time * 1.3 + L.phase));

      L.refl.position.set(px + ux * len * 0.5, 0.03, pz + uz * len * 0.5);
      L.refl.rotation.y = Math.atan2(ux, uz);
      L.refl.scale.set(wid, len, 1);
      L.refl.material.opacity = hFade * hFade * 0.55 * vis * sceneDim;
      L.refl.visible = true;
    } else {
      L.refl.visible = false;
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   fireflies — a few, drifting low, never in a hurry
   ═══════════════════════════════════════════════════════════════════════ */
const fireflies = [];
for (let i = 0; i < CONFIG.fireflyCount; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX.glow, color: CONFIG.fireflyHue, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: true, opacity: 0,
  }));
  s.scale.setScalar(0.34);
  scene.add(s);
  fireflies.push({
    s,
    ox: (Math.random() - 0.5) * 30,
    oy: 0.5 + Math.random() * 2.2,
    oz: -6 - Math.random() * 26,
    a: Math.random() * 6.28, b: Math.random() * 6.28,
    sa: 0.10 + Math.random() * 0.16,
    sb: 0.07 + Math.random() * 0.13,
    ra: 1.4 + Math.random() * 3.2,
    rb: 0.5 + Math.random() * 1.1,
    pulse: Math.random() * 6.28,
    // each firefly appears and disappears on its own long cycle
    cycle: 26 + Math.random() * 40,
    offset: Math.random() * 60,
  });
}

function updateFireflies(dt) {
  for (const f of fireflies) {
    f.a += dt * f.sa * motionSlow;
    f.b += dt * f.sb * motionSlow;
    f.pulse += dt * 1.1;

    f.s.position.set(
      f.ox + Math.sin(f.a) * f.ra,
      f.oy + Math.sin(f.b * 1.7) * f.rb,
      f.oz + Math.cos(f.a * 0.8) * f.ra
    );

    // slow presence envelope so they wander in and out of the scene
    const p = ((time + f.offset) % f.cycle) / f.cycle;
    const present = Math.sin(p * Math.PI);
    const blink = 0.45 + 0.55 * Math.pow(Math.max(0, Math.sin(f.pulse)), 2.0);
    f.s.material.opacity = present * blink * 0.5 * sceneDim;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   wind + breeze
   ═══════════════════════════════════════════════════════════════════════ */
const breezes = [];

function windVector(t) {
  // layered sines ≈ a very lazy noise field
  const x = (Math.sin(t * 0.061) * 0.6 + Math.sin(t * 0.017 + 1.3) * 0.4) * CONFIG.windStrength;
  const z = (Math.sin(t * 0.043 + 2.1) * 0.5) * CONFIG.windStrength * 0.5;
  return { x, y: z };
}

// dx/dz are a unit direction; strength is 0..1 from how far the finger moved
function addBreeze(x, z, dx, dz, strength) {
  if (breezes.length >= 8) breezes.shift();
  breezes.push({ x, z, dx, dz, strength, r: CONFIG.breezeRadius, life: 1 });
}

function updateBreezes(dt) {
  for (let i = breezes.length - 1; i >= 0; i--) {
    const b = breezes[i];
    b.life -= dt / CONFIG.breezeDecay;
    b.r += dt * 3.0;                        // the puff spreads as it dies
    if (b.life <= 0) breezes.splice(i, 1);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   input — tap / hold / drag, all on pointer events
   ═══════════════════════════════════════════════════════════════════════ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

// glow that swells under the finger while holding
const holdGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: TEX.halo, color: CONFIG.lanternWarm, transparent: true, opacity: 0,
  depthWrite: false, blending: THREE.AdditiveBlending, fog: true,
}));
holdGlow.scale.setScalar(2);
scene.add(holdGlow);

const pointers = new Map();
let hintDone = false;
let lastInteraction = performance.now();

// screen point → a spot on the water; falls back to a sensible distance
// when the finger is above the horizon
function screenToWater(px, py, out) {
  ndc.x = (px / window.innerWidth) * 2 - 1;
  ndc.y = -(py / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.ray.intersectPlane(waterPlane, out);
  if (!hit) {
    // pointing at the sky — drop the lantern a comfortable way out
    out.copy(raycaster.ray.origin).addScaledVector(raycaster.ray.direction, 34);
    out.y = 0;
  }
  // keep the spawn point a comfortable distance out, measured from the camera
  const cx = camera.position.x, cz = camera.position.z;
  let dx = out.x - cx, dz = out.z - cz;
  const d = Math.hypot(dx, dz) || 1;
  const clamped = THREE.MathUtils.clamp(d, CONFIG.nearestSpawn, CONFIG.farthestSpawn);
  out.x = cx + (dx / d) * clamped;
  out.z = cz + (dz / d) * clamped;
  out.y = 0;
  return out;
}

function onDown(e) {
  wake();
  const p = {
    id: e.pointerId,
    x0: e.clientX, y0: e.clientY,
    x: e.clientX, y: e.clientY,
    t0: performance.now(),
    dragged: false,
    world: new THREE.Vector3(),
    puffX: 0, puffZ: 0,
  };
  screenToWater(e.clientX, e.clientY, p.world);
  p.puffX = p.world.x; p.puffZ = p.world.z;
  pointers.set(e.pointerId, p);

  if (!hintDone) {
    hintDone = true;
    hintEl.classList.remove('show');
    soundEl.classList.add('show');
    startAudio();
    requestWakeLock();
  }
}

function onMove(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  lastInteraction = performance.now();
  p.x = e.clientX; p.y = e.clientY;

  if (!p.dragged && Math.hypot(p.x - p.x0, p.y - p.y0) > 14) p.dragged = true;

  screenToWater(p.x, p.y, p.world);

  if (p.dragged) {
    // Throttle by distance so a long drag lays down a few puffs, not one per
    // event, and normalise so a fast swipe is no more forceful than a slow one.
    const dx = p.world.x - p.puffX;
    const dz = p.world.z - p.puffZ;
    const mag = Math.hypot(dx, dz);
    if (mag > 0.6) {
      addBreeze(p.world.x, p.world.z, dx / mag, dz / mag,
                THREE.MathUtils.clamp(mag / 2.5, 0.15, 1));
      p.puffX = p.world.x; p.puffZ = p.world.z;
    }
  }
}

function onUp(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  lastInteraction = performance.now();

  // don't spawn on the tap that wakes the scene from a deep sleep fade
  if (wokeFromSleep) { wokeFromSleep = false; return; }

  if (!p.dragged) {
    const held = performance.now() - p.t0;
    const bigness = THREE.MathUtils.clamp(
      (held - CONFIG.holdForBig) / (CONFIG.holdMax - CONFIG.holdForBig), 0, 1);
    spawnLantern(p.world.x, p.world.z, bigness);
  }
}

function onCancel(e) { pointers.delete(e.pointerId); }

const el = renderer.domElement;
el.addEventListener('pointerdown', onDown,  { passive: true });
el.addEventListener('pointermove', onMove,  { passive: true });
el.addEventListener('pointerup',   onUp,    { passive: true });
el.addEventListener('pointercancel', onCancel, { passive: true });
el.addEventListener('pointerleave',  onCancel, { passive: true });

// belt-and-braces against scroll / zoom / double-tap zoom
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

function updateHoldGlow(dt) {
  let best = null, bestHeld = 0;
  for (const p of pointers.values()) {
    if (p.dragged) continue;
    const held = performance.now() - p.t0;
    if (held > bestHeld) { bestHeld = held; best = p; }
  }
  const m = holdGlow.material;
  if (best && bestHeld > 180) {
    const k = THREE.MathUtils.clamp((bestHeld - 180) / CONFIG.holdMax, 0, 1);
    holdGlow.position.set(best.world.x, 0.25, best.world.z);
    holdGlow.scale.setScalar(1.6 + k * 4.4);
    m.opacity = THREE.MathUtils.damp(m.opacity, 0.10 + k * 0.30, 6, dt) * sceneDim;
    holdGlow.visible = true;
  } else {
    m.opacity = THREE.MathUtils.damp(m.opacity, 0, 8, dt);
    holdGlow.visible = m.opacity > 0.002;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   sleep fade — dims to black after a long idle, any tap brings it back
   ═══════════════════════════════════════════════════════════════════════ */
const veilEl  = document.getElementById('veil');
const hintEl  = document.getElementById('hint');
const soundEl = document.getElementById('sound');

let sceneDim = 1;              // 1 = awake, 0 = fully asleep
let wokeFromSleep = false;

function wake() {
  if (sceneDim < 0.9) wokeFromSleep = true;
  lastInteraction = performance.now();
}

function updateSleep(dt) {
  const idle = (performance.now() - lastInteraction) / 1000;
  let target = 1;
  if (idle > CONFIG.sleepAfter) {
    target = THREE.MathUtils.clamp(1 - (idle - CONFIG.sleepAfter) / CONFIG.sleepFade, 0, 1);
  }
  const rate = target > sceneDim ? (1 / CONFIG.wakeFade) : (1 / CONFIG.sleepFade) * 1.4;
  sceneDim += THREE.MathUtils.clamp(target - sceneDim, -rate * dt, rate * dt);
  sceneDim = THREE.MathUtils.clamp(sceneDim, 0, 1);

  veilEl.style.opacity = (1 - sceneDim).toFixed(3);
  renderer.toneMappingExposure = CONFIG.exposure * (0.25 + 0.75 * sceneDim);
  setAudioDim(sceneDim);
}

/* ═══════════════════════════════════════════════════════════════════════
   audio — synthesised on the fly (nothing to download, works offline)
   very soft pad + a filtered-noise "water" wash. Starts on first tap.
   ═══════════════════════════════════════════════════════════════════════ */
let actx = null, master = null, padGain = null, muted = false, audioDim = 1;

function startAudio() {
  if (actx || !CONFIG.audioOn) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    actx = new AC();
    actx.resume?.();               // Safari sometimes starts suspended
    master = actx.createGain();
    master.gain.value = 0;
    master.connect(actx.destination);
    // fade in over several seconds — never a sudden onset
    master.gain.linearRampToValueAtTime(CONFIG.volume, actx.currentTime + 8);

    // ── pad: three detuned sines through a soft lowpass ──
    padGain = actx.createGain();
    padGain.gain.value = 0.5;
    const padFilter = actx.createBiquadFilter();
    padFilter.type = 'lowpass';
    padFilter.frequency.value = 420;
    padFilter.Q.value = 0.4;
    padGain.connect(padFilter).connect(master);

    const chord = [110.0, 164.81, 220.0, 246.94];
    chord.forEach((f, i) => {
      const o = actx.createOscillator();
      o.type = i % 2 ? 'sine' : 'triangle';
      o.frequency.value = f;
      o.detune.value = (Math.random() - 0.5) * 9;
      const g = actx.createGain();
      g.gain.value = 0.16 / (i + 1);
      // each voice breathes on its own slow LFO
      const lfo = actx.createOscillator();
      lfo.frequency.value = 0.035 + Math.random() * 0.05;
      const lfoGain = actx.createGain();
      lfoGain.gain.value = g.gain.value * 0.7;
      lfo.connect(lfoGain).connect(g.gain);
      o.connect(g).connect(padGain);
      o.start(); lfo.start();
    });

    // ── water: looping pink-ish noise, filter slowly opening and closing ──
    const len = actx.sampleRate * 4;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.997 * b0 + w * 0.0555;
      b1 = 0.985 * b1 + w * 0.0750;
      b2 = 0.950 * b2 + w * 0.1538;
      d[i] = (b0 + b1 + b2 + w * 0.02) * 0.28;
    }
    // crossfade the loop point so there is no click every 4 seconds
    const fade = Math.floor(actx.sampleRate * 0.25);
    for (let i = 0; i < fade; i++) {
      const k = i / fade;
      d[i] = d[i] * k + d[len - fade + i] * (1 - k);
    }

    const noise = actx.createBufferSource();
    noise.buffer = buf; noise.loop = true;
    const nf = actx.createBiquadFilter();
    nf.type = 'lowpass'; nf.frequency.value = 380; nf.Q.value = 0.6;
    const ng = actx.createGain(); ng.gain.value = 0.30;

    const swell = actx.createOscillator();
    swell.frequency.value = 0.045;
    const swellGain = actx.createGain();
    swellGain.gain.value = 190;
    swell.connect(swellGain).connect(nf.frequency);

    noise.connect(nf).connect(ng).connect(master);
    noise.start(); swell.start();
  } catch (err) {
    actx = null;   // audio is optional; the scene carries on regardless
  }
}

function setAudioDim(v) {
  if (!master || !actx) return;
  if (Math.abs(v - audioDim) < 0.01) return;
  audioDim = v;
  const target = muted ? 0 : CONFIG.volume * (0.15 + 0.85 * v);
  master.gain.setTargetAtTime(target, actx.currentTime, 1.5);
}

soundEl.addEventListener('click', () => {
  muted = !muted;
  soundEl.classList.toggle('muted', muted);
  if (actx && master) {
    master.gain.setTargetAtTime(
      muted ? 0 : CONFIG.volume * (0.15 + 0.85 * sceneDim), actx.currentTime, 1.2);
  }
  lastInteraction = performance.now();
});

// browsers suspend the context when the tab is hidden
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  if (document.hidden) actx.suspend?.();
  else actx.resume?.();
});

/* ═══════════════════════════════════════════════════════════════════════
   wake lock — keep the screen on, silently skip it if unsupported
   ═══════════════════════════════════════════════════════════════════════ */
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch { /* denied or unsupported — no problem */ }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !wakeLock && hintDone) requestWakeLock();
});

/* ═══════════════════════════════════════════════════════════════════════
   resize / orientation
   ═══════════════════════════════════════════════════════════════════════ */
let pixelRatio = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  // widen the field of view in portrait so there is plenty of sky
  camera.fov = camera.aspect < 0.75 ? 72 : 62;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(w, h, false);
  starUniforms.uScale.value = Math.min(1.6, h / 780 + 0.35);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

/* ═══════════════════════════════════════════════════════════════════════
   adaptive quality — if frames get expensive, quietly step things down
   ═══════════════════════════════════════════════════════════════════════ */
let frameAcc = 0, frameCount = 0, degradeStep = 0;

function checkPerformance(dt) {
  if (!CONFIG.autoDegrade || degradeStep >= 2) return;
  frameAcc += dt; frameCount++;
  if (frameCount < 90) return;
  const fps = frameCount / frameAcc;
  frameAcc = 0; frameCount = 0;
  if (fps > 27) return;

  degradeStep++;
  if (degradeStep === 1) {
    pixelRatio = Math.max(1, pixelRatio * 0.75);
    resize();
  } else {
    starsFar.visible = false;
    waterUniforms.uSpark.value = 0;
    for (const m of mists) m.visible = false;
    CONFIG.maxLanterns = Math.min(CONFIG.maxLanterns, 18);
    while (lanterns.length > CONFIG.maxLanterns) retire(lanterns[0]);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   slow mood drift — colour and star density over several minutes
   ═══════════════════════════════════════════════════════════════════════ */
const skyA = new THREE.Color(CONFIG.skyTopA);
const skyB = new THREE.Color(CONFIG.skyTopB);
const tmpColor = new THREE.Color();
const motionSlow = reduceMotion ? 0.6 : 1;

function updateMood() {
  const p = time / CONFIG.moodPeriod;
  const k = 0.5 + 0.5 * Math.sin(p * Math.PI * 2);
  tmpColor.copy(skyA).lerp(skyB, k);
  skyUniforms.uTop.value.copy(tmpColor);

  // star density breathes on a slightly different cycle so it never syncs up
  starUniforms.uDensity.value = 0.62 + 0.30 * (0.5 + 0.5 * Math.sin(p * Math.PI * 2 * 0.61 + 1.1));
  starUniforms.uOpacity.value = CONFIG.starBrightness * (0.85 + 0.15 * k) * sceneDim;
}

/* ═══════════════════════════════════════════════════════════════════════
   main loop
   ═══════════════════════════════════════════════════════════════════════ */
const camLook = new THREE.Vector3(0, 6.6, -34);   // pitched slightly up: more sky than lake

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp after a tab switch
  time += dt;

  updateSleep(dt);
  updateMood();
  updateBreezes(dt);
  updateLanterns(dt);
  updateFireflies(dt);
  updateHoldGlow(dt);
  checkPerformance(dt);

  // barely-there camera breathing
  const bob = CONFIG.bobAmount * motion;
  camera.position.y = CONFIG.camHeight + Math.sin(time * CONFIG.bobSpeed) * bob;
  camera.position.x = Math.sin(time * CONFIG.bobSpeed * 0.63) * bob * 3.2;
  camera.lookAt(camLook.x + Math.sin(time * 0.05) * 0.6 * motion, camLook.y, camLook.z);

  starsNear.rotation.y += dt * CONFIG.starDrift * motionSlow;
  starsFar.rotation.y  += dt * CONFIG.starDrift * 0.45 * motionSlow;

  for (const m of mists) {
    m.position.x += m.userData.speed * dt * motionSlow;
    if (m.position.x >  120) m.position.x = -120;
    if (m.position.x < -120) m.position.x =  120;
  }

  starUniforms.uTime.value = time;
  waterUniforms.uTime.value = time;
  waterUniforms.uCam.value.copy(camera.position);
  water.position.x = camera.position.x;          // keep the plane centred
  water.position.z = camera.position.z;
  sky.position.copy(camera.position);

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

/* first-run hint: fades up on a dark screen, gone on the first touch */
setTimeout(() => { if (!hintDone) hintEl.classList.add('show'); }, 2600);

/* let go of the GPU context politely if the page is discarded */
window.addEventListener('pagehide', () => { renderer.setAnimationLoop(null); });
window.addEventListener('pageshow', () => { renderer.setAnimationLoop(animate); });
</script>
</body>
</html>
